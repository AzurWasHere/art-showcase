services:
  db:
    image: postgres:17-alpine
    container_name: art-showcase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: art
      POSTGRES_PASSWORD: art
      POSTGRES_DB: art_showcase
    ports:
      # Host port 5433 to avoid clashing with other local Postgres instances.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - art_showcase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U art -d art_showcase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  art_showcase_pgdata:
